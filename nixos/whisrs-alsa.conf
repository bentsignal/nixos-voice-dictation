#
# whisrs capture profile for this machine.
#
# PipeWire's ALSA "default" PCM currently advertises the output endpoint to
# CPAL and rejects a 16 kHz mono capture stream. Keep playback on PipeWire,
# but route capture through ALSA's plug converter to the Logitech C920.
#
pcm.!default {
  type plug
  slave.pcm {
    type hw
    card C920
    device 0
  }
}

ctl.!default {
  type hw
  card PCH
}
